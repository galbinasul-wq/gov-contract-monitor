name: Hourly Contract Monitor

# Runs the scan every hour and commits any updated dedup state back to the repo
# so that next hour's run remembers what we've already alerted on.

on:
  schedule:
    # 13 minutes past every hour. (GitHub recommends offsetting from :00 to
    # avoid scheduling congestion. Cron syntax: m h dom mon dow.)
    - cron: '13 * * * *'
  workflow_dispatch:  # lets you trigger the workflow manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit the updated state file

concurrency:
  group: monitor
  cancel-in-progress: false  # let an in-flight scan finish before next one

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scan
        env:
          EMAIL_SMTP_HOST: smtp.gmail.com
          EMAIL_SMTP_PORT: '587'
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO:       ${{ secrets.EMAIL_TO }}
        run: python monitor.py --once

      - name: Commit updated state (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor_state.db
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "state: update dedup db ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
